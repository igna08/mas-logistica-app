{% extends "base.html" %}

{% block title %}Gestión de Usuarios - {{ super() }}{% endblock %}

{% block page_title %}Gestión de Usuarios{% endblock %}

{% block content %}
<div x-data="{ createModalOpen: false, editModalOpen: false, editingUser: {} }">
    <div id="alert-container" class="mb-4"></div>
    <div class="flex justify-end items-center mb-6">
        <button @click="createModalOpen = true" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
            Crear Nuevo Usuario
        </button>
    </div>

    <!-- User List Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <!-- ... thead ... -->
            <tbody class="bg-white divide-y divide-gray-200">
                {% for user in users %}
                <tr id="user-row-{{ user.id }}">
                    <!-- ... user data cells ... -->
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium" id="actions-cell-{{ user.id }}">
                        <button @click="editingUser = {{ user.to_dict() | tojson }}; editModalOpen = true" class="edit-btn text-indigo-600 hover:text-indigo-900">Editar</button>
                        {% if user.activo %}
                            <button data-action="deactivate" data-id="{{ user.id }}" class="action-btn ml-4 text-red-600 hover:text-red-900">Desactivar</button>
                        {% else %}
                            <button data-action="approve" data-id="{{ user.id }}" class="action-btn ml-4 text-green-600 hover:text-green-900">Aprobar</button>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Create User Modal -->
    <!-- ... create modal ... -->

    <!-- Edit User Modal -->
    <div x-show="editModalOpen" class="fixed z-10 inset-0 overflow-y-auto">
        <div class="flex items-end justify-center min-h-screen">
            <div x-show="editModalOpen" @click.away="editModalOpen = false" class="fixed inset-0 bg-gray-500 bg-opacity-75"></div>
            <div x-show="editModalOpen" class="bg-white rounded-lg text-left overflow-hidden shadow-xl transform w-full max-w-lg m-8">
                <form id="edit-user-form">
                    <div class="bg-white px-6 py-4">
                        <h3 class="text-lg font-medium text-gray-900">Editar Usuario</h3>
                        <div id="edit-modal-alert-container" class="mt-4"></div>
                        <div class="mt-4 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nombre</label>
                                <input type="text" id="edit-nombre" x-model="editingUser.nombre" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Rol</label>
                                <select id="edit-rol" x-model="editingUser.rol" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm">
                                    <option value="chofer">Chofer</option>
                                    <option value="mantenimiento">Mantenimiento</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-6 py-3 flex flex-row-reverse">
                        <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">Guardar</button>
                        <button @click="editModalOpen = false" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 sm:mt-0 sm:w-auto sm:text-sm">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// ... existing script ...

document.getElementById('edit-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const userId = document.querySelector('[x-data]').__x.$data.editingUser.id;
    const formData = {
        nombre: document.getElementById('edit-nombre').value,
        rol: document.getElementById('edit-rol').value
    };

    try {
        const response = await fetch(`/api/admin/users/${userId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        });
        const data = await response.json();
        if (!response.ok) {
            showAlert(data.msg || 'Error al actualizar.', 'red', 'edit-modal-alert-container');
        } else {
            showAlert('Usuario actualizado con éxito.', 'green');
            // A simple way is to reload the page to see changes
            window.location.reload();
        }
    } catch (error) {
        showAlert('Error de conexión.', 'red', 'edit-modal-alert-container');
    }
});
</script>
{% endblock %}
