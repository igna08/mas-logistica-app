{% extends "base.html" %}

{% block title %}Iniciar Nuevo Recorrido - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Iniciar Nuevo Recorrido</h1>

    <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <strong class="font-bold">Error:</strong>
        <span class="block sm:inline" id="error-message"></span>
    </div>

    <form id="inicio-recorrido-form" class="bg-white p-6 rounded-lg shadow-md">

        <!-- Selector de Vehículo -->
        <div class="mb-4">
            <label for="vehiculo_id" class="block text-gray-700 font-semibold mb-2">Vehículo (Patente)</label>
            <select id="vehiculo_id" name="vehiculo_id" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- Seleccione un vehículo --</option>
                {% for vehiculo in vehiculos %}
                    <option value="{{ vehiculo.id }}">{{ vehiculo.patente }} - {{ vehiculo.modelo }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- KM Inicial -->
        <div class="mb-4">
            <label for="km_inicial" class="block text-gray-700 font-semibold mb-2">Kilometraje Inicial</label>
            <input type="number" id="km_inicial" name="km_inicial" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 150200">
        </div>

        <!-- Estado Inicial -->
        <div class="mb-4">
            <label for="estado_inicial" class="block text-gray-700 font-semibold mb-2">Estado General del Vehículo</label>
            <textarea id="estado_inicial" name="estado_inicial" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describa el estado de chapa, pintura, cubiertas, etc."></textarea>
        </div>

        <!-- Observaciones -->
        <div class="mb-4">
            <label for="observaciones_inicio" class="block text-gray-700 font-semibold mb-2">Observaciones de Inicio</label>
            <textarea id="observaciones_inicio" name="observaciones_inicio" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cualquier otra observación relevante"></textarea>
        </div>

        <!-- Botón de Envío -->
        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Iniciar Recorrido
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('inicio-recorrido-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = {
            vehiculo_id: document.getElementById('vehiculo_id').value,
            km_inicial: document.getElementById('km_inicial').value,
            estado_inicial: document.getElementById('estado_inicial').value,
            observaciones_inicio: document.getElementById('observaciones_inicio').value,
        };

        const errorAlert = document.getElementById('error-alert');
        const errorMessage = document.getElementById('error-message');
        errorAlert.classList.add('hidden');

        try {
            const response = await fetch('/api/recorridos/inicio', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData),
            });

            const data = await response.json();

            if (!response.ok) {
                errorMessage.textContent = data.msg || 'Error al iniciar el recorrido.';
                errorAlert.classList.remove('hidden');
            } else {
                alert('Recorrido iniciado con éxito!');
                window.location.href = '/chofer/dashboard';
            }
        } catch (error) {
            errorMessage.textContent = 'No se pudo conectar con el servidor.';
            errorAlert.classList.remove('hidden');
            console.error('Error starting recorrido:', error);
        }
    });
</script>
{% endblock %}
