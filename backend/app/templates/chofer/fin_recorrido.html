{% extends "base.html" %}

{% block title %}Finalizar Recorrido - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Finalizar Recorrido</h1>

    <form action="/recorrido/{{ recorrido.id }}/fin" method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md">

        <div class="mb-4">
            <p><span class="font-semibold">Vehículo:</span> {{ recorrido.vehiculo.patente }}</p>
            <p><span class="font-semibold">KM Inicial:</span> {{ recorrido.km_inicial }}</p>
        </div>

        <!-- KM Final -->
        <div class="mb-4">
            <label for="km_final" class="block text-gray-700 font-semibold mb-2">Kilometraje Final</label>
            <input type="number" id="km_final" name="km_final" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 150450">
        </div>

        <!-- Estado Final -->
        <div class="mb-4">
            <label for="estado_final" class="block text-gray-700 font-semibold mb-2">Estado Final del Vehículo</label>
            <textarea id="estado_final" name="estado_final" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describa el estado final de chapa, pintura, etc."></textarea>
        </div>

        <hr class="my-6">

        <h2 class="text-xl font-bold text-gray-800 mb-4">Carga de Combustible</h2>

        <!-- Combustible Litros -->
        <div class="mb-4">
            <label for="combustible_litros" class="block text-gray-700 font-semibold mb-2">Litros de Combustible</label>
            <input type="number" step="0.01" id="combustible_litros" name="combustible_litros" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 45.5">
        </div>

        <!-- Combustible Costo -->
        <div class="mb-4">
            <label for="combustible_costo" class="block text-gray-700 font-semibold mb-2">Costo Total del Combustible</label>
            <input type="number" step="0.01" id="combustible_costo" name="combustible_costo" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 50000.00">
        </div>

        <!-- Combustible Foto -->
        <div class="mb-4">
            <label for="combustible_foto" class="block text-gray-700 font-semibold mb-2">Foto del Comprobante de Combustible</label>
            <input type="file" id="combustible_foto" name="combustible_foto" accept="image/png, image/jpeg" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <hr class="my-6">

        <!-- Observaciones Fin -->
        <div class="mb-4">
            <label for="observaciones_fin" class="block text-gray-700 font-semibold mb-2">Observaciones de Cierre</label>
            <textarea id="observaciones_fin" name="observaciones_fin" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cualquier otra observación relevante al finalizar."></textarea>
        </div>

        <!-- Botón de Envío -->
        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Finalizar y Cerrar Recorrido
            </button>
        </div>
    </form>
</div>
{% endblock %}
