{% extends "base.html" %}

{% block title %}Finalizar Recorrido - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Finalizar Recorrido</h1>

    <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <strong class="font-bold">Error:</strong>
        <span class="block sm:inline" id="error-message"></span>
    </div>
    <div id="info-alert" class="hidden bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline" id="info-message"></span>
    </div>

    <form id="fin-recorrido-form" class="bg-white p-6 rounded-lg shadow-md">

        <div class="mb-4">
            <p><span class="font-semibold">Vehículo:</span> {{ recorrido.vehiculo.patente }}</p>
            <p><span class="font-semibold">KM Inicial:</span> {{ '%.2f'|format(recorrido.km_inicial|float) }}</p>
        </div>

        <!-- KM Final -->
        <div class="mb-4">
            <label for="km_final" class="block text-gray-700 font-semibold mb-2">Kilometraje Final</label>
            <input type="number" id="km_final" name="km_final" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 150450">
        </div>

        <!-- Estado Final -->
        <div class="mb-4">
            <label for="estado_final" class="block text-gray-700 font-semibold mb-2">Estado Final del Vehículo</label>
            <textarea id="estado_final" name="estado_final" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describa el estado final de chapa, pintura, etc."></textarea>
        </div>

        <hr class="my-6">

        <h2 class="text-xl font-bold text-gray-800 mb-4">Carga de Combustible</h2>

        <div class="mb-4">
            <label for="combustible_litros" class="block text-gray-700 font-semibold mb-2">Litros</label>
            <input type="number" step="0.01" id="combustible_litros" name="combustible_litros" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 45.5">
        </div>

        <div class="mb-4">
            <label for="combustible_costo" class="block text-gray-700 font-semibold mb-2">Costo Total</label>
            <input type="number" step="0.01" id="combustible_costo" name="combustible_costo" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 50000.00">
        </div>

        <div class="mb-4">
            <label for="combustible_foto" class="block text-gray-700 font-semibold mb-2">Foto del Comprobante</label>
            <input type="file" id="combustible_foto" name="combustible_foto" accept="image/png, image/jpeg" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <hr class="my-6">

        <div class="mb-4">
            <label for="observaciones_fin" class="block text-gray-700 font-semibold mb-2">Observaciones de Cierre</label>
            <textarea id="observaciones_fin" name="observaciones_fin" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cualquier otra observación relevante al finalizar."></textarea>
        </div>

        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50" id="submit-button">
                Finalizar y Cerrar Recorrido
            </button>
        </div>
    </form>
</div>

<script>
document.getElementById('fin-recorrido-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitButton = document.getElementById('submit-button');
    submitButton.disabled = true;
    submitButton.textContent = 'Procesando...';

    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');
    const infoAlert = document.getElementById('info-alert');
    const infoMessage = document.getElementById('info-message');
    errorAlert.classList.add('hidden');
    infoAlert.classList.add('hidden');

    let fotoUrl = null;
    const fotoFile = document.getElementById('combustible_foto').files[0];

    // Step 1: If there's a photo, upload it to S3 first
    if (fotoFile) {
        infoMessage.textContent = 'Subiendo foto...';
        infoAlert.classList.remove('hidden');
        try {
            // 1a: Get pre-signed URL from our backend
            const presignResponse = await fetch('/api/uploads/presign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: fotoFile.name, content_type: fotoFile.type })
            });

            if (!presignResponse.ok) throw new Error('Could not get pre-signed URL.');
            const presignData = await presignResponse.json();

            // 1b: Upload file to S3 using the pre-signed URL
            const s3FormData = new FormData();
            Object.entries(presignData.fields).forEach(([key, value]) => {
                s3FormData.append(key, value);
            });
            s3FormData.append('file', fotoFile);

            const s3Response = await fetch(presignData.url, {
                method: 'POST',
                body: s3FormData
            });

            if (!s3Response.ok) throw new Error('Failed to upload photo to storage.');

            // The URL of the uploaded file
            fotoUrl = `${presignData.url}${presignData.fields.key}`;
            infoMessage.textContent = 'Foto subida. Finalizando recorrido...';

        } catch (error) {
            errorMessage.textContent = `Error con la foto: ${error.message}`;
            errorAlert.classList.remove('hidden');
            submitButton.disabled = false;
            submitButton.textContent = 'Finalizar y Cerrar Recorrido';
            return;
        }
    }

    // Step 2: Submit the rest of the form data to our backend
    const finData = {
        km_final: document.getElementById('km_final').value,
        estado_final: document.getElementById('estado_final').value,
        combustible_litros: document.getElementById('combustible_litros').value || null,
        combustible_costo: document.getElementById('combustible_costo').value || null,
        observaciones_fin: document.getElementById('observaciones_fin').value,
        combustible_foto: fotoUrl
    };

    try {
        const recorridoId = '{{ recorrido.id }}';
        const response = await fetch(`/api/recorridos/${recorridoId}/fin`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(finData)
        });

        const data = await response.json();

        if (!response.ok) {
            errorMessage.textContent = data.msg || 'Error al finalizar el recorrido.';
            errorAlert.classList.remove('hidden');
        } else {
            alert('Recorrido finalizado con éxito!');
            window.location.href = '/chofer/dashboard';
        }
    } catch (error) {
        errorMessage.textContent = 'No se pudo conectar con el servidor.';
        errorAlert.classList.remove('hidden');
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Finalizar y Cerrar Recorrido';
    }
});
</script>
{% endblock %}
