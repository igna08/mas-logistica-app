{% extends "base.html" %}

{% block title %}Reporte de Recorridos - {{ super() }}{% endblock %}

{% block page_title %}Reporte de Recorridos{% endblock %}

{% block content %}
<div>
    <!-- Filtros -->
    <div class="bg-white p-4 rounded-lg shadow-md mb-6">
        <h2 class="text-lg font-semibold mb-2">Filtros</h2>
        <form id="filters-form" class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <div>
                <label for="fecha_desde" class="block text-sm font-medium text-gray-700">Desde</label>
                <input type="date" name="fecha_desde" id="fecha_desde" class="filter-input mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="fecha_hasta" class="block text-sm font-medium text-gray-700">Hasta</label>
                <input type="date" name="fecha_hasta" id="fecha_hasta" class="filter-input mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="chofer" class="block text-sm font-medium text-gray-700">Chofer</label>
                <select id="chofer" name="chofer" class="filter-input mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm">
                    <option value="">Todos</option>
                    {% for chofer in choferes %}<option value="{{ chofer.id }}">{{ chofer.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label for="vehiculo" class="block text-sm font-medium text-gray-700">Vehículo</label>
                <select id="vehiculo" name="vehiculo" class="filter-input mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm">
                    <option value="">Todos</option>
                    {% for vehiculo in vehiculos %}<option value="{{ vehiculo.id }}">{{ vehiculo.patente }}</option>{% endfor %}
                </select>
            </div>
            <div class="self-end">
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700">Filtrar</button>
            </div>
        </form>
    </div>

    <!-- Lista de Recorridos -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Inicio</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Chofer / Vehículo</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">KM</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                    <th scope="col" class="relative px-6 py-3"><span class="sr-only">Acciones</span></th>
                </tr>
            </thead>
            <tbody id="reports-table-body" class="bg-white divide-y divide-gray-200">
                <!-- Rows will be injected by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- AI Summary Modal -->
<!-- ... modal ... -->

<script>
document.addEventListener('DOMContentLoaded', function() {
    const filtersForm = document.getElementById('filters-form');
    const tableBody = document.getElementById('reports-table-body');

    async function fetchAndRenderRecorridos() {
        const params = new URLSearchParams(new FormData(filtersForm)).toString();
        const url = `/api/reports?${params}`;

        tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Cargando...</td></tr>';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch reports');
            const recorridos = await response.json();

            tableBody.innerHTML = ''; // Clear loading state
            if (recorridos.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No se encontraron recorridos con los filtros seleccionados.</td></tr>';
                return;
            }

            recorridos.forEach(r => {
                const km = (r.km_final && r.km_inicial) ? (parseFloat(r.km_final) - parseFloat(r.km_inicial)).toFixed(2) + ' km' : 'N/A';
                const statusColors = {
                    'abierto': 'bg-blue-100 text-blue-800',
                    'cerrado': 'bg-yellow-100 text-yellow-800',
                    'aprobado': 'bg-green-100 text-green-800',
                    'revision_requerida': 'bg-red-100 text-red-800'
                };
                const statusClass = statusColors[r.status] || 'bg-gray-100 text-gray-800';

                const row = `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${new Date(r.fecha_inicio).toLocaleString()}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            <div class="font-medium">${r.chofer_nombre}</div>
                            <div class="text-gray-500">${r.vehiculo_patente}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${km}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                ${r.status.replace('_', ' ')}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <a href="#" class="text-indigo-600 hover:text-indigo-900 mr-4">Ver Detalle</a>
                            <button data-id="${r.id}" class="ai-summary-btn text-purple-600 hover:text-purple-900">Resumen IA</button>
                        </td>
                    </tr>`;
                tableBody.insertAdjacentHTML('beforeend', row);
            });

        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Error al cargar los datos: ${error.message}</td></tr>`;
        }
    }

    filtersForm.addEventListener('submit', function(e) {
        e.preventDefault();
        fetchAndRenderRecorridos();
    });

    // Initial load
    fetchAndRenderRecorridos();
});

// ... AI summary script ...
</script>
{% endblock %}
