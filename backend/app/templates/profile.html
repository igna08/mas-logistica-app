{% extends "base.html" %}

{% block title %}Mi Perfil - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto max-w-2xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Mi Perfil</h1>

    <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"></div>
    <div id="success-alert" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert"></div>

    <div class="bg-white p-6 rounded-lg shadow-md">
        <form id="profile-form">
            <div class="flex items-center space-x-6 mb-6">
                <img id="profile-img-preview" class="h-24 w-24 rounded-full object-cover" src="{{ current_user.profile_picture_url or 'https://via.placeholder.com/150' }}" alt="Foto de perfil">
                <div>
                    <label for="profile_picture" class="cursor-pointer bg-white border border-gray-300 rounded-md py-2 px-3 text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cambiar Foto
                    </label>
                    <input id="profile_picture" name="profile_picture" type="file" class="sr-only" accept="image/png, image/jpeg">
                </div>
            </div>

            <div class="mb-4">
                <label for="nombre" class="block text-gray-700 font-semibold mb-2">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ current_user.nombre }}" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" value="{{ current_user.email }}" disabled class="w-full px-3 py-2 border border-gray-200 bg-gray-100 rounded-md">
            </div>

            <div class="mt-6">
                <button type="submit" id="submit-button" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('profile_picture').addEventListener('change', function(event) {
    const [file] = event.target.files;
    if (file) {
        document.getElementById('profile-img-preview').src = URL.createObjectURL(file);
    }
});

document.getElementById('profile-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitButton = document.getElementById('submit-button');
    submitButton.disabled = true;
    submitButton.textContent = 'Guardando...';

    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');
    errorAlert.classList.add('hidden');
    successAlert.classList.add('hidden');

    let newFotoUrl = null;
    const fotoFile = document.getElementById('profile_picture').files[0];

    if (fotoFile) {
        try {
            const presignResponse = await fetch('/api/uploads/presign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: fotoFile.name, content_type: fotoFile.type })
            });
            if (!presignResponse.ok) throw new Error('No se pudo obtener la URL para subir la imagen.');

            const presignData = await presignResponse.json();
            const s3FormData = new FormData();
            Object.entries(presignData.fields).forEach(([key, value]) => s3FormData.append(key, value));
            s3FormData.append('file', fotoFile);

            const s3Response = await fetch(presignData.url, { method: 'POST', body: s3FormData });
            if (!s3Response.ok) throw new Error('Falló la subida de la imagen.');

            newFotoUrl = `${presignData.url}${presignData.fields.key}`;
        } catch (error) {
            errorAlert.textContent = `Error con la foto: ${error.message}`;
            errorAlert.classList.remove('hidden');
            submitButton.disabled = false;
            submitButton.textContent = 'Guardar Cambios';
            return;
        }
    }

    const updateData = {
        nombre: document.getElementById('nombre').value,
        profile_picture_url: newFotoUrl // Will be null if no new photo was uploaded
    };

    // Filter out null values so we only send what's changed
    const finalData = Object.fromEntries(Object.entries(updateData).filter(([_, v]) => v != null));

    if (Object.keys(finalData).length === 0) {
        successAlert.textContent = 'No hay cambios para guardar.';
        successAlert.classList.remove('hidden');
        submitButton.disabled = false;
        submitButton.textContent = 'Guardar Cambios';
        return;
    }

    try {
        const response = await fetch('/api/users/me', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(finalData)
        });

        const data = await response.json();
        if (!response.ok) {
            errorAlert.textContent = data.msg || 'Error al actualizar el perfil.';
            errorAlert.classList.remove('hidden');
        } else {
            successAlert.textContent = 'Perfil actualizado con éxito.';
            successAlert.classList.remove('hidden');
        }
    } catch (error) {
        errorAlert.textContent = 'No se pudo conectar con el servidor.';
        errorAlert.classList.remove('hidden');
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Guardar Cambios';
    }
});
</script>
{% endblock %}
